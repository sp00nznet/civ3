# The installer for this commit, for Windows and Linux (recomp-launcher with
# launcher/launcher.json): artifacts on every push to main, release files on
# a v* tag.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@main
    with:
      name: Civ3-Recomp-Installer
      platforms: windows linux
