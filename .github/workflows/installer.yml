# launcher/launcher.json). Manual runs only to preserve the owner's quota.
name: installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@main
    with:
      name: Civ3-Recomp-Installer
      platforms: windows linux
